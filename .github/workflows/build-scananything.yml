name: Build ScanAnything

on:
  push:
    branches:
      - main
      - generative-dex-rewrite
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scananything-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          swift --version

      - name: Cache on-device TripoSR Core ML
        id: cache-triposr-coreml
        uses: actions/cache@v4
        with:
          path: ScanAnything/Models/TripoSRCoreML
          key: triposr-coreml-1426b49-v1

      - name: Bootstrap on-device TripoSR Core ML
        if: steps.cache-triposr-coreml.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash scripts/bootstrap-triposr-coreml.sh

      - name: Verify bundled models
        run: |
          set -euxo pipefail
          test -f ScanAnything/Models/TripoSRCoreML/ImageToTriplane.mlpackage/Manifest.json
          test -f ScanAnything/Models/TripoSRCoreML/NeRFQuery.mlpackage/Manifest.json
          du -sh ScanAnything/Models/TripoSRCoreML

      - name: Verify app has no inference network path
        run: |
          set -euxo pipefail
          if grep -R -nE 'URLSession|NWConnection|NSLocalNetworkUsageDescription|SCANANYTHING_API_BASE_URL' ScanAnything ScanAnything.xcodeproj --include='*.swift' --include='project.pbxproj'; then
            echo "Network-backed inference code/config must not ship in ScanAnything."
            exit 1
          fi

      - name: Build unsigned app
        run: |
          set -o pipefail
          rm -rf DerivedData
          xcodebuild \
            -project ScanAnything.xcodeproj \
            -scheme ScanAnything \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'ScanAnything.app' -print -quit)"
          test -n "$APP"
          test -d "$APP/ImageToTriplane.mlmodelc" -o -d "$APP/TripoSRCoreML/ImageToTriplane.mlmodelc"
          test -d "$APP/NeRFQuery.mlmodelc" -o -d "$APP/TripoSRCoreML/NeRFQuery.mlmodelc"
          du -sh "$APP"
          rm -rf Payload ScanAnything-unsigned.ipa
          mkdir Payload
          ditto "$APP" "Payload/ScanAnything.app"
          /usr/bin/zip -qry ScanAnything-unsigned.ipa Payload
          unzip -l ScanAnything-unsigned.ipa | grep 'Payload/ScanAnything.app/Info.plist'
          ls -lh ScanAnything-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: ScanAnything-unsigned
          path: ScanAnything-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Publish direct-download IPA release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release delete on-device-latest --cleanup-tag --yes || true
          gh release create on-device-latest \
            ScanAnything-unsigned.ipa \
            --target "$GITHUB_SHA" \
            --title "ScanAnything On-Device Latest" \
            --notes "Fully on-device one-photo 3D build. No inference server required." \
            --prerelease

      - name: Split IPA for direct retrieval
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("ScanAnything-unsigned.ipa")
          chunk_size = 480 * 1024 * 1024
          data = source.open("rb")
          index = 0
          while True:
              chunk = data.read(chunk_size)
              if not chunk:
                  break
              Path(f"ScanAnything-unsigned.ipa.part-{index}").write_bytes(chunk)
              index += 1
          if index != 2:
              raise SystemExit(f"Expected 2 IPA chunks, produced {index}")
          PY
          ls -lh ScanAnything-unsigned.ipa.part-*

      - name: Upload IPA part 0
        uses: actions/upload-artifact@v6
        with:
          name: ScanAnything-unsigned-part-0
          path: ScanAnything-unsigned.ipa.part-0
          if-no-files-found: error
          compression-level: 0

      - name: Upload IPA part 1
        uses: actions/upload-artifact@v6
        with:
          name: ScanAnything-unsigned-part-1
          path: ScanAnything-unsigned.ipa.part-1
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ScanAnything-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
